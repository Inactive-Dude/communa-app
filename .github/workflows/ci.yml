# ============================================================
# GitHub Actions - Communa CI/CD Pipeline
# ============================================================
# NOTE on Node.js 20 warnings:
#   GitHub is deprecating Node 20 on runners. These warnings come
#   from action vendors (checkout, upload-artifact, docker) who
#   have not yet updated their internals to Node 24. This is OUTSIDE
#   our control - warnings are harmless, builds still pass.
# ============================================================

name: Communa CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:

  # Build & Test
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: communa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_PASSWORD: testpass
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-64-characters-long-padding-padding
      ADMIN_CREATE_SECRET: ci-test-admin-secret
      MAIL_PASSWORD: dummy-ci-mail-password
      FRONTEND_URL: http://localhost:8082
      SPRING_DATASOURCE_URL: "jdbc:mysql://localhost:3306/communa_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw verify -B

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Docker Build Check
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: communa-app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max