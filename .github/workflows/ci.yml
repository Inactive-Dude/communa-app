# ============================================================
# GitHub Actions — Communa CI/CD Pipeline
# ============================================================
# Triggers:
#   • Every push to main / dev branches
#   • Every pull request targeting main
# ============================================================

name: Communa CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Build & Test ────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: communa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_PASSWORD: testpass
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-64-characters-long-padding-padding
      ADMIN_CREATE_SECRET: ci-test-admin-secret
      MAIL_PASSWORD: dummy-ci-mail-password
      FRONTEND_URL: http://localhost:8082
      # Override datasource URL to use the test database on port 3306
      SPRING_DATASOURCE_URL: "jdbc:mysql://localhost:3306/communa_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        run: ./mvnw verify -B

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # ── Docker Build Check ──────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: communa-app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scan ───────────────────────────────────────────
  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency-Check
        run: ./mvnw org.owasp:dependency-check-maven:check -B
        continue-on-error: true   # report but don't block on first run

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
        if: always()
