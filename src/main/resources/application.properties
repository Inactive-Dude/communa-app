# Server Configuration
server.port=8082

# ============================================================================
# MySQL Database Configuration
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3300/communa?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=pass

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings (optional but recommended)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================================================
# Email Configuration (Gmail)
# ============================================================================
# ⚠️ IMPORTANT: Update with your Gmail credentials if using password reset
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=aaronageorge2@gmail.com
spring.mail.password=jjxqqsewjpfdxbyr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

app.frontend.url=http://localhost:8082
# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.org.springframework.security=DEBUG
logging.level.com.login.communa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================================
# IMPORTANT NOTES:
# ============================================================================
# 1. Update spring.datasource.password with your MySQL root password
# 2. Create the database first: CREATE DATABASE communa;
