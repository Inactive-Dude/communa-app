<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Communa</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }
    .container {
      width: 350px;
      padding: 30px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background: #162938;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover:not(:disabled) { background: #2a4e69; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    p#message { margin-top: 15px; color: #ffdf6c; font-size: 0.9em; }
    p#message.error { color: #ff6b6b; }
    p#message.success { color: #6bff8e; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Forgot Password</h2>
    <p>Enter your registered email to receive a reset link.</p>
    <input type="email" id="email" placeholder="Enter your email" required />
    <button id="sendBtn" onclick="sendResetLink()">Send Reset Link</button>
    <p id="message"></p>
    <a href="index.html" style="color:#fff;text-decoration:underline;">Back to Login</a>
  </div>

  <script>
    async function sendResetLink() {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('message');
      const btn = document.getElementById('sendBtn');

      if (!email) {
        msg.className = 'error';
        msg.innerText = "Please enter your email.";
        return;
      }

      // Show loading state
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.className = '';
      msg.innerText = "Sending reset link…";

      try {
        const response = await fetch("/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        });

        // Server always returns JSON
        const data = await response.json();

        if (response.ok) {
          msg.className = 'success';
          msg.innerText = data.message || "Reset link sent! Check your inbox.";
        } else if (response.status === 429) {
          msg.className = 'error';
          msg.innerText = data.error || "Too many requests. Please wait before trying again.";
        } else {
          msg.className = 'error';
          msg.innerText = data.error || "Something went wrong. Try again.";
        }
      } catch (error) {
        msg.className = 'error';
        msg.innerText = "Error connecting to server.";
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }
  </script>

</body>
</html>
