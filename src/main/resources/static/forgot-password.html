<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Communa</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }
    .container {
      width: 350px;
      padding: 30px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 1em;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background: #162938;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
    }
    button:hover { background: #2a4e69; }
    p#message { margin-top: 15px; color: #ffdf6c; font-size: 0.9em; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Forgot Password</h2>
    <p>Enter your registered email to receive a reset link.</p>
    <input type="email" id="email" placeholder="Enter your email" required />
    <button onclick="sendResetLink()">Send Reset Link</button>
    <p id="message"></p>
    <a href="login.html" style="color:#fff;text-decoration:underline;">Back to Login</a>
  </div>

  <script>
    async function sendResetLink() {
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('message');

      if (!email) {
        msg.innerText = "Please enter your email.";
        return;
      }

      msg.innerText = "Sending reset link...";

      try {
        // --- FIX: Changed the URL from "/api/users/forgot-password" to "/forgot-password" ---
        const response = await fetch("/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        });

        const text = await response.text();
        if (response.ok) {
          msg.innerText = text || "Reset link sent! Check your inbox.";
        } else {
          // Try to parse error from JSON, otherwise show plain text
          try {
            const jsonError = JSON.parse(text);
            msg.innerText = jsonError.error || "Something went wrong. Try again.";
          } catch (e) {
            msg.innerText = text || "Something went wrong. Try again.";
          }
        }
      } catch (error) {
        msg.innerText = "Error connecting to server.";
        console.error(error);
      }
    }
  </script>

</body>
</html>
