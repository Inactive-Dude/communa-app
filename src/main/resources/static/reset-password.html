<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="Favicon.png">
  <title>Reset Password</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      margin: 0;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 12px;
      backdrop-filter: blur(15px);
      width: 350px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    h2 {
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border: none;
      background-color: #162938;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #2a4e69;
    }
    .message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Password</h2>
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="Enter new password" required minlength="8" />
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
      <button type="submit">Reset Password</button>
    </form>
    <div class="message" id="message"></div>
  </div>

  <script>
    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const messageDiv = document.getElementById("message");

      if (!token) {
        messageDiv.style.color = "red";
        messageDiv.textContent = "Invalid or missing reset link.";
        return;
      }

      if (newPassword !== confirmPassword) {
        messageDiv.style.color = "red";
        messageDiv.textContent = "Passwords do not match!";
        return;
      }

      try {
        // --- FIX: Changed the URL from "/api/users/reset-password" to "/reset-password" ---
        const response = await fetch("/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword }),
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.style.color = "lightgreen";
          messageDiv.textContent = data.message || "Password reset successful!";
          setTimeout(() => {
            window.location.href = "index.html"; // Redirect to login page
          }, 2000);
        } else {
          messageDiv.style.color = "red";
          messageDiv.textContent = data.error || "Failed to reset password.";
        }
      } catch (error) {
        messageDiv.style.color = "red";
        messageDiv.textContent = "Error connecting to server.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
