<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email | Communa</title>
  <link rel="icon" type="image/png" href="Favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
    }
    .container {
      width: 400px;
      padding: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    h2 {
      margin-bottom: 10px;
    }
    p {
      color: #ccc;
      font-size: 0.95em;
      margin-bottom: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #status-icon {
      font-size: 3em;
      margin-bottom: 10px;
    }
    #message {
      margin-top: 15px;
      color: #ffdf6c;
      font-size: 1em;
      font-weight: 500;
    }
    .error-msg {
      color: #ff6b6b !important;
    }
    .success-msg {
      color: #6bff8e !important;
    }
    a.btn-link {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: #162938;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1em;
      transition: background 0.3s ease;
    }
    a.btn-link:hover {
      background: #2a4e69;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="loading-state">
      <h2>Verifying Your Email</h2>
      <div class="spinner"></div>
      <p>Please wait while we verify your email address...</p>
    </div>

    <div id="result-state" class="hidden">
      <div id="status-icon"></div>
      <h2 id="result-title"></h2>
      <p id="message"></p>
      <a href="index.html" class="btn-link" id="login-link" class="hidden">Go to Login</a>
    </div>
  </div>

  <script>
    async function verifyEmail() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const loadingState = document.getElementById('loading-state');
      const resultState = document.getElementById('result-state');
      const statusIcon = document.getElementById('status-icon');
      const resultTitle = document.getElementById('result-title');
      const message = document.getElementById('message');
      const loginLink = document.getElementById('login-link');

      if (!token) {
        loadingState.classList.add('hidden');
        resultState.classList.remove('hidden');
        statusIcon.textContent = '⚠️';
        resultTitle.textContent = 'Invalid Link';
        message.textContent = 'No verification token found. Please check your email link.';
        message.className = 'error-msg';
        return;
      }

      try {
        const response = await fetch(`/verify-email?token=${encodeURIComponent(token)}`);
        const data = await response.json();

        loadingState.classList.add('hidden');
        resultState.classList.remove('hidden');

        if (response.ok) {
          statusIcon.textContent = '✅';
          resultTitle.textContent = 'Email Verified!';
          message.textContent = data.message || 'Your email has been verified successfully. You can now log in.';
          message.className = 'success-msg';
          loginLink.style.display = 'inline-block';
        } else {
          statusIcon.textContent = '❌';
          resultTitle.textContent = 'Verification Failed';
          message.textContent = data.error || 'The verification link is invalid or has expired.';
          message.className = 'error-msg';
          loginLink.textContent = 'Back to Home';
          loginLink.style.display = 'inline-block';
        }
      } catch (error) {
        loadingState.classList.add('hidden');
        resultState.classList.remove('hidden');
        statusIcon.textContent = '❌';
        resultTitle.textContent = 'Connection Error';
        message.textContent = 'Unable to connect to the server. Please try again later.';
        message.className = 'error-msg';
        console.error('Verification error:', error);
      }
    }

    // Run verification on page load
    document.addEventListener('DOMContentLoaded', verifyEmail);
  </script>

</body>
</html>
